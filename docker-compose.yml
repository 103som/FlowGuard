# =============================================================================
# FlowGuard — Docker Compose
#
# UI:
#   docker compose up --build
#
# CLI:
#   docker compose run --rm cli
#   docker compose run --rm cli ./scripts/flowguard.sh <dataset> <model>
# =============================================================================

x-flowguard-image: &flowguard-image
  build:
    context: .
    dockerfile: Dockerfile
  image: flowguard:latest

x-flowguard-volumes: &flowguard-volumes
  - ./data:/opt/flowguard/data
  - ./reports:/opt/flowguard/reports
  - ./models:/opt/flowguard/models
  - ./logs:/opt/flowguard/logs
  - ./flowguard.yaml:/opt/flowguard/flowguard.yaml:ro

x-flowguard-env: &flowguard-env
  PYTHONUNBUFFERED: "1"
  FLOWGUARD_CONFIG: "/opt/flowguard/flowguard.yaml"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

services:
  flowguard:
    <<: *flowguard-image
    ports:
      - "8501:8501"
    volumes: *flowguard-volumes
    environment: *flowguard-env
    init: true
    restart: unless-stopped

  cli:
    <<: *flowguard-image
    profiles:
      - cli
    volumes: *flowguard-volumes
    environment: *flowguard-env
    init: true
    stdin_open: true
    tty: true
    command: ["bash"]
