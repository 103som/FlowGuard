# =============================================================================
# FlowGuard — конфигурация проекта
# =============================================================================

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "1.0.0"
description = "Open-source инструмент анализа сетевого трафика на основе ML и JA4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "П.П. Самойлов", email = "ppsamoylov@edu.hse.ru"},
]
keywords = ["network", "security", "ml", "ja4", "tls", "anomaly-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "xgboost==2.0.3",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "plotly>=5.15",
    "streamlit>=1.28",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.7",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.0",
    "black>=23.10",
    "isort>=5.12",
    "mypy>=1.6",
]


# =============================================================================
# setuptools — где искать Python-пакет
# =============================================================================

[tool.setuptools.packages.find]
where = ["python"]
include = ["flowguard*"]
exclude = ["legacy*"]

# =============================================================================
# pytest
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",                      # сводка пропущенных/упавших тестов
    "--strict-markers",
    "--showlocals",
    "-v",
]
markers = [
    "slow: тесты, выполняющиеся более 10 секунд",
    "integration: интеграционные тесты, требующие данных",
    "smoke: базовые smoke-тесты",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["python/flowguard"]
omit = [
    "*/tests/*",
    "*/legacy/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff (быстрый линтер)
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "python/legacy",
    "cpp",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501",  # длина строки регулируется black
]

# =============================================================================
# Black (форматтер)
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    \.venv
  | python/legacy
  | cpp/.+/build
)/
'''

# =============================================================================
# isort
# =============================================================================

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "python/legacy", "cpp"]

# =============================================================================
# Mypy
# =============================================================================

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["python/legacy/", ".venv/"]
