# =============================================================================
# FlowGuard — конфигурация системы
#
# Этот файл — точка управления поведением всей системы.
# Поменяв значения здесь, можно:
#   - подставить свою модель ML;
#   - изменить признаковое пространство;
#   - настроить пороги классификации;
#   - подключить свои правила категоризации.
#
# Расположение: корень проекта (./flowguard.yaml).
# Перечитывается каждый раз при запуске пайплайна.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Модель машинного обучения
# -----------------------------------------------------------------------------
model:
  # Имя модели по умолчанию (соответствует каталогу models/active/<name>/)
  default: flow_plus_ja4

  # Конфигурация признакового пространства:
  #   flow_only        — только 24 flow-признака
  #   flow_plus_ja4    — flow + 6 JA4-признаков (рекомендуется)
  feature_set: flow_plus_ja4

  # Каталог с обученными моделями
  models_dir: models/active

  # Порог классификации (null = использовать значение из metrics.json модели)
  threshold_override: null

# -----------------------------------------------------------------------------
# 2. Парсер сетевого трафика
# -----------------------------------------------------------------------------
parser:
  # Путь к бинарю C++ парсера
  binary: cpp/FlowParser/build/pcap_flow_parser

  # Таймаут на один PCAP-файл, секунд
  timeout_per_file: 600

  # Пропускать файлы, для которых уже есть результат
  skip_existing: true

# -----------------------------------------------------------------------------
# 3. Анализ аномалий и категоризация инцидентов
# -----------------------------------------------------------------------------
analysis:
  # Минимальная оценка аномальности для попадания потока в инциденты
  min_anomaly_score: 0.5

  # Минимальное число потоков в инциденте (фильтрует случайные одиночные)
  min_flows_per_incident: 1

  # Группировка инцидентов: client_server_port | client_server | flow
  aggregation_key: client_server_port

  # Категории инцидентов и их параметры (см. подробности в docs/EXTENSIONS.md)
  categories:
    periodic_tls_beacon:
      enabled: true
      min_flows: 5
      max_interval_std: 2.0      # секунд
      severity_bonus: 0.30

    port_scan:
      enabled: true
      min_unique_ports: 10
      max_avg_duration: 1.0      # секунд
      severity_bonus: 0.25

    network_scan:
      enabled: true
      min_unique_servers: 20
      severity_bonus: 0.25

    dos_flood:
      enabled: true
      min_flows: 50
      max_duration: 30.0         # секунд
      severity_bonus: 0.40

    exfiltration:
      enabled: true
      min_bytes_ratio_fwd_bwd: 10.0
      severity_bonus: 0.35

    suspicious_tls:
      enabled: true
      severity_bonus: 0.20

    # ... остальные категории см. в docs/EXTENSIONS.md

# -----------------------------------------------------------------------------
# 4. Уровни серьёзности
# -----------------------------------------------------------------------------
severity:
  # Пороги для каждого уровня (балл серьёзности → уровень)
  thresholds:
    critical: 0.85
    high: 0.65
    medium: 0.45
    low: 0.0    # всё, что ниже medium

# -----------------------------------------------------------------------------
# 5. Отчёты и дашборд
# -----------------------------------------------------------------------------
reporting:
  # Сколько инцидентов показывать в "Топ-таблице"
  top_incidents_count: 100

  # Форматы выгрузки
  formats:
    csv: true
    xlsx: true
    json: true
    html_dashboard: true

  # Каталоги для отчётов
  reports_dir: reports/latest
  history_index: reports/runs_index.json

# -----------------------------------------------------------------------------
# 6. Веб-интерфейс
# -----------------------------------------------------------------------------
ui:
  host: 0.0.0.0
  port: 8501
  open_browser: true

# -----------------------------------------------------------------------------
# 7. Каталоги данных
# -----------------------------------------------------------------------------
paths:
  raw_dir: data/raw
  parsed_dir: data/parsed
  interim_dir: data/interim
  retrain_dir: data/retrain

# -----------------------------------------------------------------------------
# 8. Логирование
# -----------------------------------------------------------------------------
logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
  log_dir: logs
  console: true
  file: true

# -----------------------------------------------------------------------------
# 9. Переобучение (источник по умолчанию)
# -----------------------------------------------------------------------------
retraining:
  # Алгоритм обучения: xgboost | lightgbm | random_forest
  # (только xgboost реализован "из коробки", остальные требуют расширения)
  algorithm: xgboost

  # Гиперпараметры алгоритма
  hyperparams:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    random_state: 42

  # Схема разбиения выборок
  split:
    method: source_aware_family_aware    # source_aware_family_aware | random | source_aware
    train_ratio: 0.6
    val_ratio: 0.2
    test_ratio: 0.2

  # Критерий подбора порога классификации
  threshold_selection: f1_balanced       # f1 | f1_balanced | precision_at_recall
